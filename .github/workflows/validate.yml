name: Validate public toolkit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate public distribution
        run: node scripts/validate-public.mjs
      - name: Smoke install current checkout with Agent Skills CLI
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          cd "$sandbox"
          npx -y skills@1.5.22 add "$GITHUB_WORKSPACE" --skill '*' --agent claude-code --copy --yes
          for skill in \
            coding-agent-handoff \
            design-parity \
            evidence-transport \
            finalize-workstream \
            pixel-parity-calibration \
            product-ui-critique \
            runtime-regression \
            senior-dev \
            ui-design-architect \
            ui-design-authority \
            ui-review \
            ui-runtime-reviewer \
            ui-visual-reviewer
          do
            test -f ".claude/skills/$skill/SKILL.md"
          done
