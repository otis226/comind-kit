# Copy to ~/.config/comind/worker-profiles.yaml (or set AGENT_BRIDGE_WORKER_CONFIG).
# Keep secrets out of this file. api_key_env/env_from reference environment variables.
version: 1

profiles:
  claude-ui-cheap:
    runtime: claude-code
    model: your-third-party-model-id
    effort: medium
    readonly: true
    max_turns: 16
    base_url: https://gateway.example.com
    api_key_env: UI_REVIEW_GATEWAY_TOKEN
    # Default is Authorization: Bearer. Use api-key for x-api-key gateways.
    api_key_mode: auth-token

  grok-runtime-review:
    runtime: grok
    model: grok-4.6
    readonly: true
    needs_browser: true
    max_turns: 20

  codex-implementation:
    runtime: codex
    model: gpt-5.6-sol
    readonly: false
    max_turns: 40

# Canonical CoMind roles are Agent Skills, so prefer skills: mappings.
# agents: remains available for explicit project/user agent definitions.
skills:
  ui-visual-reviewer: claude-ui-cheap
  ui-runtime-reviewer: grok-runtime-review
  bounded-code-worker: codex-implementation
