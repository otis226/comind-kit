name: Validate public toolkit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: read

jobs:
  canonical-export-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare candidate with trusted sanitized export
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/otis226/comind-kit.git refs/heads/canonical-export
          git diff --exit-code --name-status HEAD FETCH_HEAD

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate public distribution
        run: node scripts/validate-public.mjs
      - name: Test public validator regressions
        run: node --test scripts/tests/*.test.mjs
      - name: Smoke install current checkout across native runtimes
        shell: bash
        run: |
          set -euo pipefail
          skills=(
            bounded-code-worker
            coding-agent-handoff
            design-parity
            evidence-transport
            finalize-workstream
            llm-resource-governor
            pixel-parity-calibration
            product-ui-critique
            runtime-regression
            senior-dev
            ui-design-architect
            ui-design-authority
            ui-review
            ui-runtime-reviewer
            ui-visual-reviewer
          )

          for agent in claude-code cursor codex grok; do
            sandbox="$(mktemp -d)"
            cd "$sandbox"
            npx -y skills@1.5.22 add "$GITHUB_WORKSPACE" --skill '*' --agent "$agent" --copy --yes

            case "$agent" in
              claude-code) target='.claude/skills' ;;
              cursor|codex) target='.agents/skills' ;;
              grok) target='.grok/skills' ;;
            esac

            for skill in "${skills[@]}"; do
              test -f "$target/$skill/SKILL.md"
            done
          done
